# Словарь понятий: синонимы и переводы ru/uk сводятся к одному понятию.
# words — начальные формы слов (леммы), как их возвращает pymorphy3.
# label — как понятие называется в отчёте.
#
# Пополняется по реальным данным: если два запроса об одном и том же попали в разные
# группы, обычно не хватает слова здесь.

[change]
label = "изменить"
words = [
  "изменить", "изменять", "изменение", "поменять", "менять", "сменить", "смена",
  "заменить", "замена", "поменяться",
  "змінити", "змінювати", "зміна", "поміняти", "міняти", "замінити", "заміна",
]

[payment]
label = "оплата"
words = [
  "оплата", "оплатить", "оплачивать", "платёж", "платеж", "платить", "заплатить",
  "оплатити", "сплатити", "сплата", "платіж", "платити", "заплатити", "оплачувати",
]

[method]
label = "способ"
words = ["способ", "метод", "вариант", "спосіб", "варіант"]

[card]
label = "карта"
words = ["карта", "карточка", "картка", "card"]

[sms]
label = "SMS"
words = ["смс", "sms", "смска", "эсэмэска", "смс-код", "sms-код"]

[code]
label = "код"
words = ["код", "code"]

[receive]
label = "приходит"
words = [
  "приходить", "прийти", "дойти", "доходить", "получить", "получать", "поступать", "поступить",
  "приходити", "надходити", "надійти", "отримати", "отримувати", "дійти", "доходити",
]

[cancel]
label = "отмена"
words = [
  "отменить", "отмена", "отменять", "аннулировать",
  "скасувати", "скасування", "скасовувати", "відмінити", "відміна",
]

[booking]
label = "бронирование"
words = [
  "бронирование", "бронь", "бронировать", "забронировать", "запись", "записаться",
  "бронювання", "броня", "бронювати", "забронювати", "запис", "записатися",
]

[order]
label = "заказ"
words = ["заказ", "заказать", "заказывать", "замовлення", "замовити", "замовляти"]

[employee]
label = "сотрудник"
words = [
  "сотрудник", "сотрудница", "работник", "персонал", "мастер",
  "співробітник", "співробітниця", "працівник", "працівниця", "майстер",
]

[add]
label = "добавить"
words = ["добавить", "добавлять", "добавление", "додати", "додавати", "додавання"]

[refund]
label = "возврат"
words = [
  "возврат", "вернуть", "возвращать", "возвратить",
  "повернення", "повернути", "повертати",
]

[money]
label = "деньги"
words = ["деньги", "средство", "сумма", "гроші", "кошти", "кошт", "сума"]

[view]
label = "посмотреть"
words = [
  "посмотреть", "смотреть", "просмотреть", "глянуть", "увидеть",
  "подивитися", "дивитися", "переглянути", "переглядати", "глянути", "побачити",
]

[promo]
label = "акция"
words = ["акция", "промоакция", "промо", "акція", "промоакція"]

[limit]
label = "лимит"
words = [
  "лимит", "ограничение", "ограничить", "ограничивать",
  "ліміт", "обмеження", "обмежити", "обмежувати",
]
