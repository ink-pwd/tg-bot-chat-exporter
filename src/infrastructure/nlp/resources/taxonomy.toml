# Классификация запросов поддержки Dots: 14 категорий и 90 типов.
# Взята из годового отчёта по поддержке (тот же список, что у CEO), переведена на русский.
# Ключи типов совпадают с ключами модели intent_model.npz — переименовывать только вместе с ней.
#
# title  — как тип называется в отчёте;
# answer — стандартный ответ поддержки на такой запрос.

[categories]
pos = "Интеграция с POS"
menu = "Меню и каталог"
venue = "Заведения, график и доставка"
orders = "Заказы"
couriers = "Курьеры и логистика"
payments = "Оплаты и возвраты"
loyalty = "Кешбэк и бонусы"
promo = "Акции, промокоды и баннеры"
marketing = "Пуши, SMS и маркетинг"
apps = "Сайт и приложения"
clients = "Аккаунты клиентов"
access = "Доступы и админ-панель"
billing = "Счета, отчёты и документы"
requests = "Статус обращений и пожелания"

# --- Интеграция с POS -------------------------------------------------------

[intents.pos_order_not_sent]
category = "pos"
title = "Заказ не дошёл до POS"
answer = "Проверьте кнопку POS у заказа или лог в панели мониторинга. Частые причины: позиции или модификатора нет во внешнем меню POS для этой точки, нет связи с терминалом, не совпадает сумма или валюта (чаевые, весовые товары), истекла лицензия точки. Устраните причину, выгрузите заказ повторно (или внесите вручную) и сообщите поддержке номер заказа. Системные ошибки передаются разработчикам в тот же день."

[intents.pos_menu_sync]
category = "pos"
title = "Синхронизация меню и цен с POS"
answer = "Запустите Каталог → Синхронизация с POS (Poster/Syrve/iiko), выберите «добавить новые» и/или «обновить существующие» (цены, вес, фото). Можно включить автосинхронизацию (удаления, стоп-лист, цены). Ненужные онлайн позиции отключайте в Dots, а не удаляйте. Если позиция не обновилась, проверьте, что она есть во внешнем меню POS именно этой точки с тем же ID."

[intents.pos_mapping_errors]
category = "pos"
title = "Ошибка сопоставления товара или модификатора в POS"
answer = "POS отклоняет заказ, если ID товара или модификатора нет или он неактивен во внешнем меню, если у весового товара неверный формат количества или сумма оплаты не совпадает с суммой заказа. Исправьте сопоставление (ID из техкарт POS) и синхронизируйте заново."

[intents.pos_status_sync]
category = "pos"
title = "Статусы заказов из POS"
answer = "Статусы (принят, готов, закрыт) синхронизируются из POS в Dots. В Poster, если время выдачи не перенесли при опоздании, POS может сам отметить заказ готовым. Проверьте историю действий по заказу в POS."

[intents.pos_discounts_bonuses]
category = "pos"
title = "Передача скидок и бонусов в POS"
answer = "Скидки и промокоды передаются в POS либо как скидка, распределённая по позициям, либо как сертификат/тип оплаты — зависит от настроек интеграции. Кешбэк можно передавать скидкой. При большом кешбэке позиция может прийти с нулевой ценой — проверьте, как это обрабатывает POS."

[intents.pos_tables]
category = "pos"
title = "Заказы со столов попадают не туда"
answer = "Заказы со стола (QR) передают в POS номер стола. Сопоставление столов Dots и POS должно совпадать для каждой точки. Если заказ пришёл не на тот стол или как самовывоз, пришлите номер стола и заказа для проверки."

[intents.pos_order_fields]
category = "pos"
title = "Дополнительные поля заказа в POS"
answer = "Комментарий, количество приборов, стоимость доставки (отдельным товаром «Доставка»), источник заказа и адрес передаются в POS по настройкам интеграции. Товар доставки должен быть в выгрузке меню POS. Сообщите, какого поля не хватает и в каком чеке."

[intents.pos_loyalty_card]
category = "pos"
title = "Карта лояльности гостя в POS"
answer = "При интеграции лояльности с POS (Syrve/Poster) клиент, зарегистрированный в Dots, создаётся в POS с номером телефона как номером карты и попадает в настроенную группу гостей. Если карта не находится, проверьте регистрацию и синхронизацию телефона и сопоставление группы. Пришлите телефон клиента для проверки."

[intents.integration_setup]
category = "pos"
title = "Настройка интеграции (POS, 1C, API, телефония)"
answer = "Интеграции (POS, 1C через webhook, телефония вроде Binotel, CRM) настраивает поддержка вместе с интегратором. Пришлите контакт интегратора и требования. API и webhook задокументированы и могут быть расширены по запросу."

# --- Меню и каталог ---------------------------------------------------------

[intents.menu_stop_list]
category = "menu"
title = "Стоп-лист: скрыть или вернуть позицию"
answer = "Позицию ставят на стоп или паузу в панели компании (на уровне заведения) или в панели управления, либо она приходит из стоп-листа POS при включённой автосинхронизации. Скрытые позиции пропадают с сайта и из приложения за несколько минут. Поддержка может сделать это сама: пришлите позицию и точку."

[intents.menu_item_edit]
category = "menu"
title = "Добавить или изменить позицию меню"
answer = "Позиции редактируются в панели управления → Каталог → Товары (название, описание, вес, КБЖУ, фото, переводы, цена). С интеграцией POS цены и вес приходят из POS: меняйте их там и запускайте синхронизацию с «обновить существующие». Изменения появляются на сайте через 5–7 минут, в приложениях — после обновления. Фото: .jpg/.png до 1 МБ."

[intents.menu_categories]
category = "menu"
title = "Категории меню"
answer = "Категории и подкатегории — в панели управления → Каталог → Категории: создать, переименовать, перетащить, задать расписание или скрыть. Позицию переносят, меняя её категорию. Часть возможностей (подкатегории, «Популярное») пока работает только на сайте."

[intents.menu_modifiers]
category = "menu"
title = "Модификаторы, добавки и размеры"
answer = "Модификаторы — группы опций у позиции (размер, соусы, топпинги) с ценами; при интеграции они приходят из POS. Связать группы модификаторов между собой Dots не умеет, поэтому такие варианты обычно делают отдельными позициями. Упаковку можно добавить платной позицией или автоматически к заказу."

[intents.menu_copy]
category = "menu"
title = "Скопировать меню на другую точку"
answer = "Откройте точку с меню → Копировать → Каталог, выберите город и точку назначения. Нужен доступ к обеим точкам."

[intents.menu_upsell]
category = "menu"
title = "Рекомендуемые товары в корзине"
answer = "Рекомендуемые (апсейл) товары в корзине настраиваются в панели управления для каждой позиции или категории."

[intents.item_labels]
category = "menu"
title = "КБЖУ, аллергены и метки позиций"
answer = "У позиции можно указать вес, калории, БЖУ и технические метки (весовой, вегетарианский, острый, постный). Аллергены и свои метки — в описании или метками, где поддерживается. Заполняется в Каталог → Товары."

[intents.menu_schedule]
category = "menu"
title = "Расписание категорий и позиций"
answer = "У категории может быть своё расписание (дни и часы), вне его она скрыта. Позиции можно показывать только для просмотра, без добавления в корзину. Настраивается в Каталог → Категории или через поддержку."

[intents.translations]
category = "menu"
title = "Переводы меню и языковые версии"
answer = "Сайт и приложения поддерживают несколько языков. У товаров, категорий и модификаторов есть вкладка «Переводы». Синхронизация с POS приносит только основной язык, переводы добавляются в Dots."

[intents.multi_catalog]
category = "menu"
title = "Мультикаталог и несколько брендов"
answer = "Мультикаталог позволяет каждой точке иметь своё меню при общем сайте и приложении. Несколько брендов можно показать отдельными заведениями. Меню привязываются к точкам в панели управления, структуру настраивает поддержка."

# --- Заведения, график и доставка ------------------------------------------

[intents.venue_close_open]
category = "venue"
title = "Закрыть, приостановить или открыть заведение"
answer = "Точку можно поставить на паузу (без заказов или только самовывоз) либо закрыть временно или насовсем в панели управления или через поддержку. Клиент видит информер с причиной. При закрытии насовсем обновите зоны доставки, чтобы соседние точки покрывали адреса."

[intents.venue_schedule]
category = "venue"
title = "График работы и время последнего заказа"
answer = "График задаётся для каждой точки (и типа заказа) в панели управления → Точки → Расписание, включая особые дни и праздники. Время последнего заказа — это закрытие минус время приготовления. Поддержка может поменять график: пришлите точку и часы."

[intents.venue_delivery_zone]
category = "venue"
title = "Зона доставки"
answer = "Зона доставки — многоугольник для каждой точки в панели управления → Точки → Зона доставки. Цена берётся из тарифной карты (зоны со своей ценой и минимальным заказом) или по расстоянию. Тарифные зоны должны полностью покрывать зону доставки. «Адрес вне зоны доставки» — точка на карте вне всех многоугольников: расширьте зону или сообщите, какая точка должна её покрывать."

[intents.venue_delivery_price]
category = "venue"
title = "Стоимость доставки и минимальный заказ"
answer = "Цена доставки, минимальный заказ и порог бесплатной доставки задаются по городу или точке: по тарифной карте или по расстоянию. Минимальный заказ может действовать только на доставку или и на самовывоз. Оператор может поменять стоимость доставки в заказе, но с интеграцией POS — только в POS."

[intents.venue_delivery_time]
category = "venue"
title = "Время приготовления и доставки, слоты"
answer = "Клиент видит время приготовления плюс время доставки. Время приготовления и дополнительное время доставки задаются для точки, само время доставки считается по расстоянию. Лимиты заказов на слот не дают принять слишком много заказов на одно время."

[intents.new_location_setup]
category = "venue"
title = "Новая точка или город"
answer = "Пришлите данные точки: адрес, телефон, график, зону доставки и тарифы, платёжные данные и меню (или подключите POS). Поддержка создаёт точку (или копирует существующую), вы проверяете тестовым заказом, после чего она публикуется."

[intents.launch_testing]
category = "venue"
title = "Тестирование перед запуском"
answer = "Перед запуском поддержка вместе с вами делает тестовые заказы (предупредите заведение), проверяет оплаты, выгрузку в POS и уведомления и может провести короткую демонстрацию экрана. Публикация — после успешного теста."

# --- Заказы -----------------------------------------------------------------

[intents.order_investigate]
category = "orders"
title = "Проверить конкретный заказ"
answer = "Поддержка смотрит историю заказа (статусы, оплата, лог выгрузки в POS, назначение курьера) и отвечает, в чём причина. Всегда присылайте номер или ссылку на заказ и что с ним не так."

[intents.order_cancel]
category = "orders"
title = "Отменить или удалить заказ"
answer = "Заказ отменяется в панели мониторинга или панели компании (Отклонить/Отменить). При онлайн-оплате холд снимается или деньги возвращаются автоматически, сроки зависят от банка. Если заказ отменили в POS, закройте чек без оплаты или удалите его. Тестовые заказы — предупредите заведение и отмените после проверки."

[intents.order_edit]
category = "orders"
title = "Изменить принятый заказ"
answer = "Принятый заказ можно менять в панели мониторинга (позиции, адрес, доставка, тип оплаты) до закрытия. При онлайн-оплате списывается только итоговая сумма, разница освобождается. С интеграцией POS меняйте заказ в POS."

[intents.order_not_arrived_panel]
category = "orders"
title = "Заказы не приходят в панель, нет звука"
answer = "Заказы принимаются в веб-панели компании (company.dots.live) или панели мониторинга, старое приложение заведения не поддерживается. Держите вкладку открытой, разрешите уведомления и звук браузера, проверьте фильтры точки и города. Если заказа нет в терминале POS — см. «Заказ не дошёл до POS»."

[intents.order_status_meaning]
category = "orders"
title = "Что значит статус или метка заказа"
answer = "Цвета и метки заказа в панели мониторинга показывают этап: новый, принят, готовится, готов, у курьера, доставлен, и проблемы (просрочена оплата, ошибка выгрузки в POS, не найден курьер). Пришлите скриншот — поддержка объяснит."

[intents.order_preorder]
category = "orders"
title = "Предзаказ на время"
answer = "Клиент может заказать на конкретное время в пределах графика. Заказ уходит в заведение во «время выдачи минус время приготовления» или сразу с указанием планового времени — по настройкам."

[intents.order_pickup_dinein]
category = "orders"
title = "Самовывоз, в зале, навынос"
answer = "Доступные типы заказа задаются для точки: доставка, самовывоз, в зале/со стола (QR). Ограничить позиции по типу заказа нельзя — используйте отдельную точку со своим меню. Скидки на самовывоз — отдельные акции и не суммируются с другими, если это не разрешено."

[intents.order_tips]
category = "orders"
title = "Чаевые"
answer = "Чаевые клиент выбирает при онлайн-оплате. Они идут курьеру (видны в приложении курьера и панели мониторинга), в POS не передаются и выплачиваются вместе с выплатами курьерам."

[intents.ordering_blocked]
category = "orders"
title = "Клиенты не могут оформить заказ"
answer = "Проверьте, что город и точка активны, точка работает по графику, не на паузе и не «только самовывоз», а адрес внутри зоны доставки. Поддержка проверит настройки и сразу исправит."

[intents.order_close_manual]
category = "orders"
title = "Закрыть зависший заказ вручную"
answer = "Доставленные, но не закрытые заказы закрываются в панели мониторинга кнопкой «Доставить». За прошлые дни поддержка закроет пачкой — пришлите номера. Закрытие нужно для начисления кешбэка и корректных отчётов."

[intents.order_routing]
category = "orders"
title = "Перенести заказ на другую точку"
answer = "Заказ идёт на ближайшую точку, покрывающую адрес (доставка), или на выбранную клиентом (самовывоз). Оператор может переназначить заказ на другую точку того же города в панели мониторинга. Между городами перенести нельзя."

[intents.auto_accept]
category = "orders"
title = "Автопринятие и автозакрытие заказов"
answer = "Заказы можно принимать автоматически через заданную задержку или закрывать автоматически после доставки. Настраивается для точки в панели управления или через поддержку."

# --- Курьеры и логистика ---------------------------------------------------

[intents.courier_not_assigned]
category = "couriers"
title = "Курьер не назначен или не найден"
answer = "Для доставки агрегаторами (Glovo, Wolt, Uklon) курьер запрашивается автоматически, когда заказ готов к отправке. Если курьер не найден, провайдер возвращает код ошибки — поддержка проверит. Переназначьте или снимите курьера в панели мониторинга и при необходимости отправьте своим курьером или такси."

[intents.courier_merge_dispatch]
category = "couriers"
title = "Объединение заказов и автоназначение курьеров"
answer = "Автоназначение распределяет заказы между свободными курьерами и может объединять заказы в одном направлении по точке, времени выдачи и загрузке курьера. Правила настраиваются по городу. Если объединились далёкие заказы, разъедините вручную и пришлите пример поддержке."

[intents.courier_app]
category = "couriers"
title = "Приложение курьера"
answer = "Курьеры работают в приложении Dots для курьеров (Android/iOS или APK от поддержки). Аккаунты создаёт администратор и привязывает к точкам. Доступ к геолокации должен быть «всегда». Если курьер не может отметить заказ, его закрывает оператор."

[intents.courier_earnings]
category = "couriers"
title = "Выплаты курьерам"
answer = "Заработок курьера — плата за доставки плюс чаевые минус удержания, считается по сменам. Если доставка не начислилась, пришлите номер заказа — поддержка проверит и поправит баланс."

[intents.courier_tracking]
category = "couriers"
title = "Клиент не видит курьера на карте"
answer = "Клиент видит курьера на карте после того, как тот забрал заказ. Отслеживание можно выключить для города. Неверное положение обычно значит, что у курьера геолокация не «всегда»."

[intents.courier_settings]
category = "couriers"
title = "Настройки курьеров"
answer = "Курьеров создают в панели управления и привязывают к точкам. В режиме «эфир» новые заказы предлагаются всем курьерам онлайн. Курьеров можно ограничить заведениями, настройки смен определяют, остаются ли они онлайн."

[intents.address_geocoding]
category = "couriers"
title = "Адрес не найден или неверная точка на карте"
answer = "Адреса определяет картографический провайдер. Если метка клиента неверна, заказ приходит с неточными координатами. Поддержка может добавить адрес вручную по координатам, оператор — поправить метку в заказе. Пришлите номер заказа и правильный адрес."

# --- Оплаты и возвраты -----------------------------------------------------

[intents.payment_toggle]
category = "payments"
title = "Включить или выключить способ оплаты"
answer = "Способы оплаты (онлайн, картой курьеру, наличными) включаются для точки или города. Поддержка переключит по запросу, например выключит наличные или включит онлайн-оплату в новом городе после добавления данных провайдера."

[intents.payment_failed]
category = "payments"
title = "Онлайн-оплата не прошла"
answer = "Поддержка проверяет статус платежа у провайдера (создан, захолдирован, оплачен, отклонён). Неоплаченный онлайн-заказ ждёт оплату 15 минут и отменяется автоматически, поздняя оплата возвращается. Если страница оплаты не открывается, возможен временный сбой провайдера или банка — запасной вариант: наличные или карта курьеру."

[intents.payment_refund]
category = "payments"
title = "Возврат денег клиенту"
answer = "При отмене заказа или уменьшении суммы разница освобождается или возвращается автоматически. Клиент видит деньги по срокам своего банка (обычно 1–7 рабочих дней). Для возврата из кабинета провайдера (LiqPay, mono, Portmone) запросите у провайдера RRN. Ускорить обработку банком Dots не может."

[intents.payment_provider]
category = "payments"
title = "Подключить или сменить платёжного провайдера"
answer = "Поддерживаются Portmone (единственный с разделением платежа между юрлицами), Plata by mono, LiqPay, WayForPay, Fondy, Stripe и Square. Для подключения нужны ключи/токен мерчанта для каждого юрлица и тестовый заказ. Выплаты и комиссии — на стороне провайдера. Для фискализации с mono нужен Checkbox."

[intents.payment_type_mismatch]
category = "payments"
title = "Неверный тип оплаты в заказе"
answer = "Тип оплаты выбирает клиент, оператор может поменять его в заказе. Если значок или тип не обновился, пришлите номер заказа — поддержка передаст пример разработчикам. Названия типов оплаты фиксированы платформой."

[intents.payment_hold_capture]
category = "payments"
title = "Холд и списание онлайн-оплаты"
answer = "Онлайн-оплата сначала холдируется на карте и списывается при завершении заказа — только итоговая сумма, остальное освобождается. Неоплаченные заказы ждут настроенное время (по умолчанию 15 минут) и отменяются. Холды, не списанные автоматически, можно списать вручную."

[intents.prepayment_rules]
category = "payments"
title = "Правила предоплаты"
answer = "Предоплату можно требовать для первых заказов, заказов выше суммы или наличных сверх лимита. Оператор может отправить клиенту ссылку на оплату из панели мониторинга. Пороги задаются по городу."

# --- Кешбэк и бонусы -------------------------------------------------------

[intents.cashback_settings]
category = "loyalty"
title = "Настройка кешбэка и бонусов"
answer = "Кешбэк настраивается для аккаунта: процент начисления (может отличаться для сайта/приложения и типа заказа), приветственный бонус, максимальная доля заказа бонусами, срок действия (с пуш-напоминаниями), исключённые категории. Бонусы начисляются после завершения заказа. Баллы хранятся в Dots или синхронизируются с программой лояльности POS."

[intents.bonus_client_balance]
category = "loyalty"
title = "Бонусы клиента не начислились или списались"
answer = "Поддержка проверяет журнал бонусных операций клиента (начисления, списания, сгорания). За отменённые заказы бонусы не начисляются, баллы сгорают по сроку. Ручная корректировка — в профиле клиента: плюс начисляет, минус списывает."

[intents.referral]
category = "loyalty"
title = "Реферальная программа"
answer = "Реферальная программа работает на сайте и в приложении. Задаются бонус приглашённому и пригласившему, момент начисления (при регистрации или после первого заказа друга) и максимум приглашённых."

# --- Акции, промокоды и баннеры --------------------------------------------

[intents.promo_campaign]
category = "promo"
title = "Настройка акции"
answer = "Акции настраиваются в панели управления → Маркетинг → Акции: скидка (% или фиксированная, на всё, категории или позиции), подарок, N+1, день рождения, скидка на самовывоз, ограниченные по времени. Проверьте условия: канал, тип заказа, минимальную сумму, расписание, флаги «суммировать с другими скидками» и «разрешить списание бонусов». Без разрешения акции не суммируются — применяется самая выгодная."

[intents.promo_code]
category = "promo"
title = "Промокод: создать или почему не работает"
answer = "Промокод всегда привязан к скрытой акции с применением «По промокоду»: скидка, сертификат или подарок. Можно ограничить число использований, одно использование на клиента или только первый заказ, минимальную сумму и каналы. Коды генерируются в Маркетинг → Промокоды → Коды, там же статистика. Если код не применяется, проверьте даты, канал, минимальную сумму и не перебивает ли его другая скидка."

[intents.banner]
category = "promo"
title = "Баннеры и сторис"
answer = "Баннеры добавляются в Маркетинг → Баннеры (на город или к акции): .png/.jpg до 1 МБ, рекомендуемо 1440×960. Им можно задать порядок и расписание. Если баннер пропал, проверьте расписание или связанную акцию. Приложения обновляют баннеры при перезапуске."

[intents.informer]
category = "promo"
title = "Информер на сайте"
answer = "Информер — короткое уведомление на меню, в категории или в оформлении заказа (например, «доставка сегодня дольше из-за погоды»). Может быть на нескольких языках и по расписанию. Пришлите текст и где его показать."

[intents.qr_codes]
category = "promo"
title = "QR-коды и печатное меню"
answer = "Поддержка сгенерирует QR-коды на скачивание приложения (умная ссылка в нужный магазин), сайт, страницу меню или QR столов для заказа в зале. PDF-меню можно разместить по ссылке сайта. Сообщите, куда должен вести QR."

# --- Пуши, SMS и маркетинг -------------------------------------------------

[intents.telegram_bot_alerts]
category = "marketing"
title = "Telegram-бот уведомлений для персонала"
answer = "Уведомления персоналу (новый заказ, отмена, оплата, ошибка выгрузки в POS) присылает Telegram-бот Dots. Подключается по инструкции поддержки (ссылка на бот + /start с токеном доступа). У каждой точки или менеджера может быть свой чат. Если уведомления пропали, проверьте, что бот всё ещё в чате и токен актуален."

[intents.analytics_ads]
category = "marketing"
title = "Аналитика и рекламные пиксели"
answer = "Google Analytics 4, Meta Pixel и Conversions API, теги Google Ads и товарные фиды подключаются в панели управления → Интеграции (инструкция: dots.crisp.help). Аналитика приложений собирается в общем Firebase, прямого доступа нет. Используйте маркетинговый отчёт в Отчётах."

[intents.sms_provider]
category = "marketing"
title = "SMS-провайдер, альфа-имя и баланс"
answer = "SMS (коды входа, рассылки) отправляются через TurboSMS или SendPulse с вашим зарегистрированным альфа-именем; регистрация занимает несколько дней и требует документов компании. Пополняйте баланс SMS в кабинете провайдера, иначе коды перестанут приходить."

[intents.push_campaign]
category = "marketing"
title = "Пуш-рассылка клиентам"
answer = "Пуши отправляются в Маркетинг → Рассылки или автоматически сценариями. Выберите аудиторию и не ограничивайте по городу, если нужны все клиенты. Пуш получают только пользователи приложения с включёнными уведомлениями, остальным — SMS (нужны альфа-имя и баланс)."

[intents.scenarios]
category = "marketing"
title = "Автоматические сценарии маркетинга"
answer = "Сценарии автоматизируют маркетинг: триггер (регистрация, день рождения, неактивность, заказ выше суммы), условия и действие (баллы, промокод, пуш/SMS). У каждой задачи сценария есть статистика. Проверяйте на аккаунте сотрудника перед включением."

[intents.reviews]
category = "marketing"
title = "Отзывы и оценки клиентов"
answer = "Оценки и отзывы из приложения и сайта видны в панели управления и могут пересылаться в Telegram-чат. Отвечайте клиентам через свои каналы; отзывы в магазинах — в App Store Connect / Google Play Console."

[intents.client_notifications]
category = "marketing"
title = "Уведомления клиентам о заказе"
answer = "Клиенты получают уведомления о статусе заказа пушем (пользователи приложения) или SMS, по желанию — звонок робота для подтверждения. Какие статусы отправляются, текст и звонок робота настраиваются для аккаунта; поддержка поменяет по запросу."

# --- Сайт и приложения -----------------------------------------------------

[intents.site_down]
category = "apps"
title = "Сайт, приложение или панель не работает"
answer = "Поддержка сразу проверяет статус платформы. Если проблема на одном устройстве — обновите страницу, очистите кеш или обновите приложение. При общем сбое поддержка пишет обновления в чат до решения."

[intents.app_bug]
category = "apps"
title = "Ошибка в приложении или на сайте"
answer = "Пришлите устройство (iOS/Android), версию приложения (вкладка «О сервисе»), скриншот или видео и шаги воспроизведения. Поддержка воспроизводит на тестовом аккаунте и создаёт задачу разработчикам. Многое исправляется обновлением приложения."

[intents.app_store]
category = "apps"
title = "Публикация приложения в App Store и Google Play"
answer = "Публикация, переименование и обновления приложения идут через Dots (аккаунты App Store / Google Play); переименование занимает около недели с ревью. Статистику загрузок и ключевые слова поддержка пришлёт по запросу."

[intents.site_design]
category = "apps"
title = "Дизайн сайта и приложения"
answer = "Дизайн сайта и приложения (логотип, цвета, слайдеры, шрифты, фото) настраивает дизайн-команда Dots по вашим материалам и Figma. Пришлите файлы в чат. Смена иконки или названия приложения требует публикации новой версии."

[intents.domain_seo]
category = "apps"
title = "Домен, DNS и SEO"
answer = "Чтобы перенести сайт на свой домен, пропишите NS/DNS-записи от поддержки. После переключения сайт Dots открывается на вашем домене. SEO зависит от текстов меню, описаний и профиля Google Business, маркетолог Dots подскажет."

[intents.google_maps_key]
category = "apps"
title = "Ключ Google Maps и карта на сайте"
answer = "Поиск адреса и карта на сайте используют ключ Google Maps API в вашем аккаунте Google Cloud. Если закончился биллинг или бесплатный лимит, карта перестаёт работать. Проверьте биллинг и ограничения ключа или попросите поддержку создать новый ключ. Бесплатного лимита хватает примерно на 3000 заказов в месяц."

[intents.support_chat_widget]
category = "apps"
title = "Виджет онлайн-чата на сайте"
answer = "Виджет чата на сайте — сторонний сервис (например, чат-бот SendPulse). Поддержка проверит, не на стороне ли провайдера проблема. Виджет можно отключить или заменить в панели управления → Интеграции."

# --- Аккаунты клиентов -----------------------------------------------------

[intents.sms_code_login]
category = "clients"
title = "Клиенту не приходит SMS-код"
answer = "Проверьте баланс SMS-провайдера (TurboSMS / SendPulse) и есть ли запросы по этому номеру в логах. На сайте отправку блокирует непройденная reCAPTCHA. Код отправляется только при первом входе. Иностранные номера зависят от покрытия провайдера."

[intents.client_account]
category = "clients"
title = "Клиент не может войти или изменить профиль"
answer = "Поддержка найдёт клиента по телефону: заказы, бонусы, профиль. Вход — по номеру телефона и SMS-коду. Удалить аккаунт можно в профиле приложения или через поддержку. Смена номера требует нового аккаунта."

[intents.client_lookup]
category = "clients"
title = "Найти клиента по телефону, заблокировать"
answer = "Пришлите телефон клиента и что нужно (заказы, баланс бонусов, блокировка). Поддержка может добавить клиента в чёрный список — заказы с этого номера будут заблокированы."

[intents.client_import_groups]
category = "clients"
title = "Импорт клиентской базы и группы клиентов"
answer = "Клиентов и бонусные балансы можно импортировать из CSV (телефон, имя, баланс), поддержка проверит и загрузит файл. Группы клиентов (например, сотрудники со скидкой) — в Маркетинг → Группы клиентов."

# --- Доступы и админ-панель ------------------------------------------------

[intents.panel_access]
category = "access"
title = "Доступ в панель, логин, сброс пароля"
answer = "Пользователи создаются в панели управления → Пользователи с ролью (владелец, менеджер, оператор, заведение) и доступом к точкам. Пароли в системе не видны, поддержка может только задать новый. Заведения входят в company.dots.live, менеджеры — в admin.dots.live. Не пишите пароли в чатах."

[intents.panel_howto]
category = "access"
title = "Где найти настройку в панели"
answer = "Поддержка пришлёт точный путь в меню (или скриншот/видео) либо сделает настройку сама. Большинство настроек — в панели управления (admin.dots.live): Каталог, Точки, Маркетинг, Пользователи, Отчёты, Интеграции."

[intents.monitoring_panel]
category = "access"
title = "Панель мониторинга (операторская)"
answer = "Панель мониторинга (PRO) — рабочее место оператора: входящие заказы, назначение заведений и курьеров, «Табло» операторов онлайн, редактирование и отмена. Чтобы получать звонки и заказы, оператор должен быть включён на Табло. Заказы прошлых дней закрываются кнопкой «Доставить»."

[intents.training_docs]
category = "access"
title = "Инструкции и видеоуроки"
answer = "Инструкции и видео — в справочном центре Dots (dots.crisp.help) и на YouTube. Поддержка может провести короткий созвон или демонстрацию экрана."

[intents.timezone_history]
category = "access"
title = "Часовой пояс и история изменений"
answer = "Часовой пояс аккаунта задаёт поддержка; неверное время обычно значит неверный пояс. История действий показывает, кто и когда менял заказ или позицию, поддержка посмотрит по запросу."

# --- Счета, отчёты и документы ---------------------------------------------

[intents.invoice_tariff]
category = "billing"
title = "Счёт, тариф и лимит заказов"
answer = "Поддержка готовит счёт за тариф (Standard+ / PRO, за точку) и пакеты заказов (предоплата) или за превышение лимита пакета. Сообщите количество заказов или период и на какое юрлицо выставить. Часть функций (например, панель мониторинга) доступна только на PRO."

[intents.reports]
category = "billing"
title = "Отчёты и выгрузка заказов"
answer = "Отчёты — в панели управления → Отчёты: заказы, продажи по позициям, оплаты, курьеры, маркетинговый отчёт и месячный счёт по точке (выгрузка в Excel). Поддержка может подготовить отчёт по запросу."

[intents.fiscal]
category = "billing"
title = "Фискальные чеки, ПРРО, Checkbox"
answer = "Фискализация онлайн-оплат идёт через Checkbox (ПРРО), подключённый для каждого юрлица. Чек формируется при завершении заказа. Заказы, оплаченные в заведении, фискализирует POS."

[intents.legal_entity]
category = "billing"
title = "Смена юрлица (ФОП), реквизиты, договор"
answer = "Чтобы сменить юрлицо (ФОП/ООО), получающее оплаты, пришлите новые реквизиты и токен платёжного провайдера для этого юрлица. Поддержка добавит его и переключит в согласованную дату, после чего — тестовый заказ. Оферту на сайте тоже нужно обновить."

[intents.contract_cancel]
category = "billing"
title = "Расторжение договора, остановка сервиса"
answer = "Остановка сервиса или расторжение договора подтверждается письменно с финансовым отделом. Поддержка ставит точки на паузу, готовит финальный счёт и по запросу выгружает ваши данные (клиенты, заказы)."

# --- Статус обращений и пожелания ------------------------------------------

[intents.request_followup]
category = "requests"
title = "Статус обращения: исправили ли, когда сделаете"
answer = "Поддержка ведёт каждый переданный запрос в Jira (задачи DEV). Обновления пишутся в чат, когда разработчики закончат или появятся новости. Статус задачи можно спросить в любой момент."

[intents.feature_request]
category = "requests"
title = "Пожелание: новая функция"
answer = "Поддержка фиксирует запрос, проверяет реализуемость с разработчиками и отвечает решением или сроками. Опишите сценарий и ожидаемое поведение."
